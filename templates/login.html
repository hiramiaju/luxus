<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso administrativo · LUXU</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;color:#161616}.panel{width:min(92vw,430px);background:#fff;border:1px solid #e6e6e6;border-radius:28px;padding:40px;box-shadow:0 20px 60px #0000000b;text-align:center}img{width:94px;height:94px;border-radius:50%;object-fit:cover}h1{font-size:25px;margin:20px 0 6px}p{color:#777;font-size:14px;margin-bottom:28px}label{text-align:left;display:block;font-size:12px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:15px;border:1px solid #d9d9d9;border-radius:13px;font-size:15px}button{border:0;background:#151515;color:white;border-radius:13px;padding:15px;width:100%;font-size:14px;font-weight:700;margin-top:25px;cursor:pointer}.error{background:#fff0f0;color:#b52424;border-radius:12px;padding:12px;font-size:13px}a{color:#777;display:block;margin-top:20px;text-decoration:none;font-size:12px}</style></head><body><main class="panel"><img src="/static/luxu-logo.png" alt="LUXU AGS"><h1>Panel LUXU</h1><p>Acceso exclusivo de administración</p>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><label for="user">Usuario</label><input id="user" name="username" autocomplete="username" required autofocus><label for="pass">Contraseña</label><input id="pass" name="password" type="password" autocomplete="current-password" required><button>Entrar al panel →</button></form><a href="/">← Regresar al catálogo</a></main></body></html>
